# Local development infrastructure only. Production uses managed Postgres and
# Redis from the hosting provider — see docs/SETUP.md.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bends
      POSTGRES_PASSWORD: bends
      POSTGRES_DB: bends_social
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bends -d bends_social"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # BullMQ requires maxmemory-policy noeviction: evicting job keys under
    # memory pressure would silently drop scheduled posts.
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
